name: extended

# The long checks, run by hand (Actions > extended > Run workflow): the GPU examples, kiln-nga,
# the texture-only build, the tests under sanitizers and a compile-time report. Fuzzing is local
# only (fuzz/CMakeLists.txt).
on:
  workflow_dispatch:
    inputs:
      examples:
        description: "Build every example (Vulkan, GL, sokol)"
        type: boolean
        default: true
      nga:
        description: "Build kiln-nga (NoGraphicsAPI, Vulkan loader from source, Slang)"
        type: boolean
        default: true
      texture_only:
        description: "Build and test with KILN_MESH=OFF"
        type: boolean
        default: true
      sanitizers:
        description: "Tests under ASan and UBSan"
        type: boolean
        default: true
      compile_time:
        description: "Full rebuild timing"
        type: boolean
        default: true

jobs:

  # Every example on the presets' settings (all GPU examples on). Build only for the windowed
  # ones: CI has no GPU; the tests include the kiln-headless runs.
  examples:
    if: inputs.examples
    name: examples (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-msvc, os: windows-latest, preset: win-msvc-debug }
          - { name: linux-clang, os: ubuntu-24.04, preset: linux-clang-debug }
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxkbcommon-dev libgl-dev

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

  # kiln-nga (docs/design/integration-examples.md): NoGraphicsAPI, a Vulkan loader built from source
  # and a Slang download, so it has a job of its own instead of joining every preset. Build only:
  # running it needs VK_EXT_descriptor_heap.
  nga:
    if: inputs.nga
    name: nga (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-msvc, os: windows-latest, preset: win-msvc-debug }
          - { name: linux-clang, os: ubuntu-24.04, preset: linux-clang-debug }
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxkbcommon-dev libgl-dev

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DKILN_EXAMPLE_NGA=ON

      - name: Build kiln-nga
        run: cmake --build --preset ${{ matrix.preset }} --target kiln-nga

  # Texture-only cook (docs/design/texture-only.md): KILN_MESH=OFF builds without the glTF

  # importer and mesh cooker, and must not fetch meshoptimizer.
  texture-only:
    if: inputs.texture_only
    name: texture-only (clang, linux-clang-debug)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Configure
        run: >
          cmake --preset linux-clang-debug -DKILN_MESH=OFF
          -DKILN_BUILD_VIEWER=OFF -DKILN_EXAMPLE_GL=OFF -DKILN_EXAMPLE_GL_BINDLESS=OFF
          -DKILN_EXAMPLE_SOKOL=OFF -DKILN_EXAMPLE_VK_BASIC=OFF

      - name: No mesh dependencies fetched
        run: test ! -e build/linux-clang-debug/_deps/meshoptimizer-src

      - name: Build
        run: cmake --build --preset linux-clang-debug

      - name: Test
        run: ctest --preset linux-clang-debug


  # The unit tests under ASan (with LeakSanitizer) and UBSan. The only exemptions are in
  # third_party/CMakeLists.txt, for vendored C.
  sanitizers:
    if: inputs.sanitizers
    name: sanitizers (clang, address + undefined)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Install KTX tools (ktx validate for writer output)
        run: |
          u=https://github.com/KhronosGroup/KTX-Software/releases/download/v4.4.2/KTX-Software-4.4.2-Linux-x86_64.deb
          curl -sSL -o ktx.deb "$u"
          echo "b7d4a0833a5aff570f01f56413e40ea8db291212  ktx.deb" | sha1sum -c -
          sudo apt-get install -y ./ktx.deb

      - name: Configure
        run: >
          cmake --preset linux-clang-debug -DKILN_SANITIZE=address,undefined
          -DKILN_BUILD_VIEWER=OFF -DKILN_EXAMPLE_GL=OFF -DKILN_EXAMPLE_GL_BINDLESS=OFF
          -DKILN_EXAMPLE_SOKOL=OFF -DKILN_EXAMPLE_VK_BASIC=OFF

      - name: Build
        run: cmake --build --preset linux-clang-debug

      - name: Test
        env:
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --preset linux-clang-debug --output-on-failure

  compile-time:
    if: inputs.compile_time
    name: compile-time
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxkbcommon-dev libgl-dev

      - name: Configure
        run: cmake --preset linux-clang-release

      - name: Full rebuild timing
        run: |
          START=$(date +%s.%N)
          cmake --build --preset linux-clang-release
          END=$(date +%s.%N)
          ELAPSED=$(echo "$END - $START" | bc)
          {
            echo "## Compile-time report"
            echo ""
            echo "Full rebuild (\`linux-clang-release\`): **${ELAPSED}s**"
          } >> "$GITHUB_STEP_SUMMARY"
          # TODO: flag >20% regression against baseline
