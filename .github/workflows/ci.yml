name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-msvc:
    name: windows-msvc (${{ matrix.config.name }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: debug, preset: win-msvc-debug }
          - { name: release, preset: win-msvc-release }
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install KTX tools (ktx validate for writer output)
        shell: pwsh
        run: |
          $u = "https://github.com/KhronosGroup/KTX-Software/releases/download/v4.4.2/KTX-Software-4.4.2-Windows-x64.exe"
          Invoke-WebRequest -Uri $u -OutFile ktx-installer.exe
          7z x ktx-installer.exe -oktxtools -y | Out-Null
          "$PWD/ktxtools/bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          & "$PWD/ktxtools/bin/ktx.exe" --version

      - name: Configure
        run: cmake --preset ${{ matrix.config.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.config.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.config.preset }}

  windows-clangcl:
    name: windows-clangcl (${{ matrix.config.name }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: debug, preset: win-clangcl-debug }
          - { name: release, preset: win-clangcl-release }
    steps:
      - uses: actions/checkout@v4

      # Sets up the MSVC environment (include/lib paths, etc.) that clang-cl
      # also relies on; must run before configuring.
      - uses: ilammy/msvc-dev-cmd@v1

      - uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install KTX tools (ktx validate for writer output)
        shell: pwsh
        run: |
          $u = "https://github.com/KhronosGroup/KTX-Software/releases/download/v4.4.2/KTX-Software-4.4.2-Windows-x64.exe"
          Invoke-WebRequest -Uri $u -OutFile ktx-installer.exe
          7z x ktx-installer.exe -oktxtools -y | Out-Null
          "$PWD/ktxtools/bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          & "$PWD/ktxtools/bin/ktx.exe" --version

      - name: Configure
        run: cmake --preset ${{ matrix.config.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.config.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.config.preset }}

  linux:
    name: linux (${{ matrix.compiler }}, ${{ matrix.preset }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { compiler: gcc, preset: linux-gcc-debug }
          - { compiler: gcc, preset: linux-gcc-release }
          - { compiler: clang, preset: linux-clang-debug }
          - { compiler: clang, preset: linux-clang-release }
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Install KTX tools (ktx validate for writer output)
        run: |
          u=https://github.com/KhronosGroup/KTX-Software/releases/download/v4.4.2/KTX-Software-4.4.2-Linux-x86_64.deb
          curl -sSL -o ktx.deb "$u"
          echo "b7d4a0833a5aff570f01f56413e40ea8db291212  ktx.deb" | sha1sum -c -
          sudo apt-get install -y ./ktx.deb
          ktx --version

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  # Read-only shipping contract (docs/design/shipping-split.md): build with
  # KILN_BUILD_COOK=OFF, run the reader-only tests, install, then build and run a
  # consumer that uses find_package(kiln) with kiln::runtime only.
  shipping:
    name: shipping (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gcc, os: ubuntu-24.04, preset: linux-gcc-shipping }
          - { name: win-msvc, os: windows-latest, preset: win-msvc-shipping }
    steps:
      - uses: actions/checkout@v4

      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - if: runner.os == 'Windows'
        uses: seanmiddleditch/gha-setup-ninja@v5

      - if: runner.os == 'Linux'
        name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test (reader-only suite)
        run: ctest --preset ${{ matrix.preset }}

      - name: Install
        run: cmake --install build/${{ matrix.preset }} --prefix ${{ github.workspace }}/prefix

      - name: Installed headers exclude cook
        shell: bash
        run: |
          test -f prefix/include/kiln/mesh.h
          test ! -e prefix/include/kiln/cook
          test ! -e prefix/lib/cmake/kiln/kilnCookTargets.cmake

      - name: Consumer configure
        run: cmake -G Ninja -S tests/shipping_consumer -B build/consumer -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=${{ github.workspace }}/prefix

      - name: Consumer build and run
        shell: bash
        run: |
          cmake --build build/consumer
          if [ "$RUNNER_OS" = "Windows" ]; then ./build/consumer/shipping_consumer.exe; else ./build/consumer/shipping_consumer; fi

  compile-time:
    name: compile-time
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Configure
        run: cmake --preset linux-clang-release

      - name: Full rebuild timing
        run: |
          START=$(date +%s.%N)
          cmake --build --preset linux-clang-release
          END=$(date +%s.%N)
          ELAPSED=$(echo "$END - $START" | bc)
          {
            echo "## Compile-time report"
            echo ""
            echo "Full rebuild (\`linux-clang-release\`): **${ELAPSED}s**"
          } >> "$GITHUB_STEP_SUMMARY"
          # TODO: flag >20% regression against baseline
